[project]
name = "pysmartdok"
version = "0.1.0"
description = "Smartdok client"
authors = [{ name = "David Skoland", email = "david.skoland@asterisk.digital" }]
requires-python = ">=3.11"

readme = "README.md"
license = { file = "LICENSE" }

dependencies = [
    "requests>=2.28",
    "beautifulsoup4>=4.12",
    "pydantic>=2.0,<3",
]

[dependency-groups]
dev = [
    "python-dotenv==1.2.2",
    "ruff==0.15.7",
    "tox==4.50.3",
    "tox-uv==1.33.4",
    "pytest==9.0.3",
    "responses==0.25.8",
]

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["pysmartdok*"]
