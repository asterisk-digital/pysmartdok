[project]
name = "pysmartdok"
version = "0.1.0"
description = "Smartdok client"
authors = [{ name = "David Skoland", email = "david.skoland@asterisk.digital" }]
requires-python = ">=3.11"

readme = "README.md"
license = { text = "MIT" }

dependencies = [
    "requests==2.33.0",
    "python-dotenv==1.2.2",
    "beautifulsoup4==4.14.3",
    "ruff==0.15.7",
    "pytest==9.0.2",
    "tox==4.50.3",
    "tox-uv==1.33.4",
]

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["pysmartdok*"]
