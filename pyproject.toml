[project]
name = "pysmartdok"
dynamic = ["version"]
description = "Typed Python client for the SmartDok REST API (RUE incidents, quality deviations, projects, users)"
authors = [{ name = "David Skoland", email = "david.skoland@asterisk.digital" }]
requires-python = ">=3.11"

readme = "README.md"
license = { file = "LICENSE" }

keywords = ["smartdok", "api", "client", "rue", "hms", "construction"]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

dependencies = [
    "requests>=2.28",
    "pydantic>=2.0,<3",
]

[project.urls]
Homepage = "https://github.com/asterisk-digital/pysmartdok"
Repository = "https://github.com/asterisk-digital/pysmartdok"
Issues = "https://github.com/asterisk-digital/pysmartdok/issues"
Changelog = "https://github.com/asterisk-digital/pysmartdok/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "python-dotenv==1.2.2",
    "ruff==0.15.7",
    "tox==4.50.3",
    "tox-uv==1.33.4",
    "pytest==9.0.3",
    "responses==0.25.8",
]

[build-system]
requires = ["setuptools>=75", "wheel", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
# Version comes from git tags. The `-test` suffix on tags routes the
# release workflow to TestPyPI but is stripped from the published version,
# so e.g. tag v0.1.0a2-test -> published version 0.1.0a2.
tag_regex = "^v(?P<version>[^-]+)(?:-test)?$"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["pysmartdok*"]

[tool.setuptools.package-data]
pysmartdok = ["py.typed"]

[tool.tox]
requires = ["tox>=4.21"]
env_list = ["py311", "py312", "py313", "py314"]

[tool.tox.env_run_base]
description = "Run tests with pytest"
package = "editable"
set_env = { PYTHONPATH = "{tox_root}/src" }
allowlist_externals = ["pytest"]
commands = [["pytest"]]
